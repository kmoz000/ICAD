name: ICAD CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DICAD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test compiler suite
        # The model-corpus benchmarks depend on large reference fixtures and
        # are run explicitly with `make benchmark`, not as a blocking CI gate.
        run: ctest --test-dir build --output-on-failure -LE benchmark

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - working-directory: editors/vscode
        run: npm ci --ignore-scripts && npm test
