name: Release ICAD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: icad-linux-x86_64
          - runner: windows-2025
            asset: icad-windows-x86_64
          - runner: macos-15-intel
            asset: icad-macos-x86_64
          - runner: macos-15
            asset: icad-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux OpenGL runtime headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DICAD_WARNINGS_AS_ERRORS=ON
          -DICAD_BUILD_DESKTOP_VIEWER=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix build/stage
      - name: Verify installed programs
        if: runner.os == 'Linux'
        run: build/stage/bin/icad --version && build/stage/bin/icad-viewer --help
      - name: Verify installed programs (macOS)
        if: runner.os == 'macOS'
        run: build/stage/icad-viewer.app/Contents/MacOS/icad-viewer --help
      - name: Verify installed programs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/stage/bin/icad.exe --version
          & build/stage/bin/icad-viewer.exe --help
      - name: Package native release
        run: cmake -E chdir build cmake -E tar cf "../${{ matrix.asset }}.zip" --format=zip -- stage
      - name: Verify native release archive
        run: cmake -E tar tf "${{ matrix.asset }}.zip"
      - name: Generate release checksum
        shell: bash
        run: cmake -E sha256sum "${{ matrix.asset }}.zip" > "${{ matrix.asset }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256
          if-no-files-found: error

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install and test extension
        working-directory: editors/vscode
        run: npm ci --ignore-scripts && npm test
      - name: Package VSIX
        working-directory: editors/vscode
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: icad-vscode
          path: build/icad-agentic-cad.vsix
          if-no-files-found: error
      - name: Publish to Visual Studio Marketplace when configured
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [[ -n "$VSCE_PAT" ]]; then
            npx vsce publish --packagePath ../../build/icad-agentic-cad.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT is not configured; the release workflow still publishes the VSIX to GitHub Releases."
          fi

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, vscode]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Create release and upload every platform package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(jq -r .version editors/vscode/package.json)
          test "v$PACKAGE_VERSION" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes
          find release-assets -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
