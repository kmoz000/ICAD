name: Release ICAD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: icad-linux-x86_64
          - runner: windows-2025
            asset: icad-windows-x86_64
          - runner: macos-15-intel
            asset: icad-macos-x86_64
          - runner: macos-15
            asset: icad-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux OpenGL runtime headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DICAD_WARNINGS_AS_ERRORS=ON
          -DICAD_BUILD_DESKTOP_VIEWER=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test release suite
        # Model-corpus benchmarks stay in normal CI and `make benchmark`. They
        # are intentionally excluded from the four-platform packaging matrix,
        # where fixture/performance variance must not block release artifacts.
        run: ctest --test-dir build -C Release --output-on-failure -LE benchmark
      - name: Install
        run: cmake --install build --config Release --prefix build/stage
      - name: Verify installed programs
        if: runner.os == 'Linux'
        run: build/stage/bin/icad --version && build/stage/bin/icad-viewer --help
      - name: Verify installed programs (macOS)
        if: runner.os == 'macOS'
        run: build/stage/icad-viewer.app/Contents/MacOS/icad-viewer --help
      - name: Verify installed programs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/stage/bin/icad.exe --version
          & build/stage/bin/icad-viewer.exe --help
      - name: Package native release
        run: cmake -E chdir build cmake -E tar cf "../${{ matrix.asset }}.zip" --format=zip -- stage
      - name: Verify native release archive
        run: cmake -E tar tf "${{ matrix.asset }}.zip"
      - name: Generate release checksum
        shell: bash
        run: cmake -E sha256sum "${{ matrix.asset }}.zip" > "${{ matrix.asset }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256
          if-no-files-found: error

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install and test extension
        working-directory: editors/vscode
        run: npm ci --ignore-scripts && npm test
      - name: Package VSIX
        working-directory: editors/vscode
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: icad-vscode
          path: build/icad-agentic-cad.vsix
          if-no-files-found: error
      - name: Publish to Visual Studio Marketplace when configured
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [[ -n "$VSCE_PAT" ]]; then
            npx vsce publish --packagePath ../../build/icad-agentic-cad.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT is not configured; the release workflow still publishes the VSIX to GitHub Releases."
          fi

  codex-plugin:
    name: Codex plugin and installers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate plugin metadata
        run: |
          jq -e '.name == "icad-agentic-cad" and (.version | length > 0) and .skills == "./skills/"' \
            editors/vscode/codex-marketplace/plugins/icad-agentic-cad/.codex-plugin/plugin.json
          jq -e '.name == "icad" and any(.plugins[]; .name == "icad-agentic-cad" and .source.path == "./editors/vscode/codex-marketplace/plugins/icad-agentic-cad")' \
            .agents/plugins/marketplace.json
          jq -e '.name == "icad" and any(.plugins[]; .name == "icad-agentic-cad")' \
            editors/vscode/codex-marketplace/.agents/plugins/marketplace.json
          sh -n editors/vscode/codex-marketplace/plugins/icad-agentic-cad/scripts/install.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("editors/vscode/codex-marketplace/plugins/icad-agentic-cad/scripts/install.ps1", [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors; exit 1 }'
      - name: Package Codex marketplace and standalone installers
        run: |
          mkdir -p build/codex-plugin/codex-marketplace
          cp -R editors/vscode/codex-marketplace/. build/codex-plugin/codex-marketplace/
          cmake -E chdir build/codex-plugin cmake -E tar cf ../icad-codex-plugin.zip --format=zip -- codex-marketplace
          cp editors/vscode/codex-marketplace/plugins/icad-agentic-cad/scripts/install.sh build/install.sh
          cp editors/vscode/codex-marketplace/plugins/icad-agentic-cad/scripts/install.ps1 build/install.ps1
          cmake -E sha256sum build/icad-codex-plugin.zip > build/icad-codex-plugin.zip.sha256
          cmake -E sha256sum build/install.sh > build/install.sh.sha256
          cmake -E sha256sum build/install.ps1 > build/install.ps1.sha256
      - name: Verify plugin release archive
        run: |
          cmake -E tar tf build/icad-codex-plugin.zip
          unzip -p build/icad-codex-plugin.zip codex-marketplace/.agents/plugins/marketplace.json | \
            jq -e '.name == "icad" and any(.plugins[]; .name == "icad-agentic-cad")'
      - uses: actions/upload-artifact@v4
        with:
          name: icad-codex-plugin
          path: |
            build/icad-codex-plugin.zip
            build/icad-codex-plugin.zip.sha256
            build/install.sh
            build/install.sh.sha256
            build/install.ps1
            build/install.ps1.sha256
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, vscode, codex-plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Create release and upload every platform package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(jq -r .version editors/vscode/package.json)
          test "v$PACKAGE_VERSION" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes
          find release-assets -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
